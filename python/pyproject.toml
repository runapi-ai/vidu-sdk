[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runapi-vidu"
version = "0.1.0"
description = "RunAPI Vidu SDK for image-to-video and reference-to-video workflows in JavaScript, Python, Ruby, Go, Java, and PHP"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "RunAPI", email = "contact@runapi.ai" }]
keywords = ["runapi", "runapi-ai", "vidu", "api", "sdk", "typescript", "python", "ruby", "golang", "java", "maven", "gradle", "video-generation", "reference-to-video", "video-api", "vidu-ai-api"]
dependencies = ["runapi-core~=0.10.1"]

[project.urls]
Homepage = "https://runapi.ai/models/vidu"
Documentation = "https://runapi.ai/docs/resources/sdks"
Source = "https://github.com/runapi-ai/vidu-sdk"
Issues = "https://github.com/runapi-ai/vidu-sdk/issues"
Changelog = "https://github.com/runapi-ai/vidu-sdk/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/runapi-ai/vidu-sdk/releases/tag/python%2Fv0.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/runapi"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.runapi]
slug = "vidu"
